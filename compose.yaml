# AIoT gateway stack for a Linux gateway box (first target: Arduino Uno Q).
#
#   cp .env.example .env        # once; edit settings there
#   docker compose up -d --build
#   docker compose logs -f gateway
#
# Dashboard on 8931, MCP on 8000, Grafana on 3000 (viewers need no login;
# admin login from GRAFANA_ADMIN_PASSWORD in .env), JupyterLab on 8888
# (token: JUPYTER_TOKEN in .env), Streamlit on 8501.
#
# Linux only: the gateway reaches the host's Bluetooth through BlueZ over the
# host D-Bus socket. Docker Desktop on Windows/macOS cannot do that.
# Details: gateway/README.md, section "Docker (Uno Q / Linux)".

name: aiot-blp

x-gateway-env: &gateway-env
  GATEWAY_STORE_BACKEND: ${GATEWAY_STORE_BACKEND:-influx}
  INFLUX_URL: http://influxdb:8086
  INFLUX_DB: ${INFLUX_DB:-aiot_blp}
  INFLUX_RAW_RETENTION: ${INFLUX_RAW_RETENTION:-7d}
  INFLUX_ROLLUP_PERIOD: ${INFLUX_ROLLUP_PERIOD:-5m}
  INFLUX_ROLLUP_RETENTION: ${INFLUX_ROLLUP_RETENTION:-52w}
  GATEWAY_KIT_ID: ${GATEWAY_KIT_ID:-}
  GATEWAY_BLE_ADAPTER: ${GATEWAY_BLE_ADAPTER:-}
  # approved rules and the capability token live next to the SQLite files
  GATEWAY_RULES_DIR: /app/gateway/data/rules.d

# Docker keeps every log line by default and the root partition on the Uno Q
# is small: at most 3 files of 10 MB per container, oldest dropped first.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  influxdb:
    image: influxdb:1.13.1
    restart: unless-stopped
    logging: *logging
    environment:
      INFLUXDB_REPORTING_DISABLED: "true"
      INFLUXDB_HTTP_LOG_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    # No published port: only the gateway, mcp and grafana containers reach
    # it, over the compose network. To inspect data:
    # docker compose exec influxdb influx
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  gateway:
    build: .
    image: aiot-blp-gateway:local
    command: ["run"]
    restart: unless-stopped
    logging: *logging
    init: true
    environment: *gateway-env
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8931}:8931"
    volumes:
      # same folder a native run uses: gateway.db / gateway_meta.db / rules.d
      - ./gateway/data:/app/gateway/data
      # BlueZ on the host, reached over the system D-Bus
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # the host's live /dev, so a USB-serial adapter plugged in after the
      # container started is still seen by the actuator link
      - /dev:/dev
    # ...and permission to open only USB-serial devices from it
    device_cgroup_rules:
      - "c 188:* rmw"   # /dev/ttyUSB*  (USB-serial adapters)
      - "c 166:* rmw"   # /dev/ttyACM*  (USB CDC boards)
    # Docker's default AppArmor profile blocks D-Bus messages to BlueZ on
    # Debian-based hosts; this lifts AppArmor for this container only.
    security_opt:
      - apparmor:unconfined

  mcp:
    # same image the gateway service builds; building it here as well made a
    # second copy on every --build and left the first one as a <none> image
    image: aiot-blp-gateway:local
    pull_policy: never
    command: ["mcp"]
    restart: unless-stopped
    logging: *logging
    init: true
    environment: *gateway-env
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8000}:8000"
    volumes:
      - ./gateway/data:/app/gateway/data

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    logging: *logging
    environment:
      INFLUX_DB: ${INFLUX_DB:-aiot_blp}  # read by the provisioned data source
      GF_SECURITY_ADMIN_USER: admin
      # only read on Grafana's first start; see gateway/README.md to change it
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-radiostudio}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/aiot_sensors.json
      # no calls home: works offline at a workshop
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # data source and the locked "AIoT sensors" dashboard, from the repo
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro

  # Analysis: JupyterLab and a Streamlit app, from the gateway image (which
  # has pandas, scikit-learn, sktime, ...). Both work in ./analysis, so
  # notebooks and apps survive restarts and can be edited on the host.
  # Reachable from the LAN: Jupyter asks for JUPYTER_TOKEN, Streamlit has no
  # login.
  jupyter:
    image: aiot-blp-gateway:local
    pull_policy: never
    entrypoint: ["jupyter", "lab"]
    command: ["--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root",
              "--ServerApp.root_dir=/app/analysis"]
    restart: unless-stopped
    logging: *logging
    init: true
    working_dir: /app/analysis
    environment:
      <<: *gateway-env
      MCP_URL: http://mcp:8000/mcp
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-radiostudio}
      # the image sets Agg for scripts; charts in notebooks need the inline one
      MPLBACKEND: module://matplotlib_inline.backend_inline
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./analysis:/app/analysis

  streamlit:
    image: aiot-blp-gateway:local
    pull_policy: never
    entrypoint: ["streamlit", "run", "/app/analysis/streamlit_app.py"]
    command: ["--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--server.runOnSave=true",
              "--browser.gatherUsageStats=false"]
    restart: unless-stopped
    logging: *logging
    init: true
    working_dir: /app/analysis
    environment:
      <<: *gateway-env
      MCP_URL: http://mcp:8000/mcp
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./analysis:/app/analysis

volumes:
  influxdb-data:
  grafana-data:
